name: deploy-smoke

# Why this exists (DEF-048, DEF-049 - found on the production server,
# 26 September 2026): 874 tests and two manual QA phases passed, yet the
# mail server aborted at its first start and the webmail could not obtain a
# certificate. Nothing had ever run Anjal the way production runs it: the
# Linux build, installed by install.sh, started by the real systemd units
# with their sandboxing, talking to the real Let's Encrypt. This job does
# exactly that on every change.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  deploy-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Build the release exactly as publish.ps1 lays it out
        run: |
          set -euo pipefail
          rel="$RUNNER_TEMP/anjal-release"
          for app in Server Webmail; do
            dotnet publish "src/Anjal.$app/Anjal.$app.csproj" -c Release -r linux-x64 --self-contained true \
              -p:PublishSingleFile=false -p:DebugType=none -o "$rel/${app,,}"
          done
          mkdir -p "$rel/bin"
          cp deploy/backup.sh deploy/restore.sh deploy/install.sh deploy/anjal-firewall.sh deploy/anjal-portcheck.sh deploy/*.service deploy/*.timer deploy/*.example tools/sql/schema.sql "$rel/bin/"
          sed -i 's/\r$//' "$rel"/bin/*.sh "$rel"/bin/*.service "$rel"/bin/*.timer "$rel"/bin/*.example
          # A release built on Windows arrives without executable bits
          # (measured on the production VM); install.sh must cope.
          chmod -x "$rel/server/Anjal.Server" "$rel/webmail/Anjal.Webmail" "$rel/bin/install.sh"
          echo "REL=$rel" >> "$GITHUB_ENV"

      - name: Install with the real install.sh and the real units
        run: |
          set -euo pipefail
          sudo bash "$REL/bin/install.sh" "$REL"
          test -x /opt/anjal/server/Anjal.Server
          test -x /opt/anjal/webmail/Anjal.Webmail
          sudo test -d /var/lib/anjal/webmail-keys
          # The units under test are the shipped ones, with no local override.
          test ! -e /etc/systemd/system/anjal-server.service.d
          test ! -e /etc/systemd/system/anjal-webmail.service.d
          systemctl show anjal-server -p RestrictAddressFamilies

      - name: PostgreSQL, role, database and the shipped schema
        run: |
          set -euo pipefail
          if ! command -v pg_ctlcluster >/dev/null; then
            sudo apt-get update -q && sudo apt-get install -y -q postgresql
          fi
          sudo systemctl start postgresql
          pw=$(openssl rand -hex 24)
          echo "::add-mask::$pw"
          echo "PGPW=$pw" >> "$GITHUB_ENV"
          (cd /tmp && sudo -u postgres psql -v ON_ERROR_STOP=1 -c "CREATE ROLE anjal LOGIN PASSWORD '$pw';" -c "CREATE DATABASE anjal OWNER anjal;")
          PGPASSWORD="$pw" psql "host=127.0.0.1 dbname=anjal user=anjal" -v ON_ERROR_STOP=1 -q -f "$REL/bin/schema.sql"
          tables=$(PGPASSWORD="$pw" psql "host=127.0.0.1 dbname=anjal user=anjal" -Atc "select count(*) from information_schema.tables where table_schema='public'")
          echo "tables: $tables"
          # 20 up to rc.6; rc.7 adds mailbox_trusted_senders, greylist_entries, settings;
          # rc.8 adds evidence, evidence_attempts, evidence_manifests; rc.12 adds mailbox_documents; rc.13 tenant_documents;
          # rc.15 adds service_records.
          test "$tables" -eq 29
          for t in mailbox_trusted_senders greylist_entries settings evidence evidence_attempts evidence_manifests mailbox_documents tenant_documents service_records; do
            PGPASSWORD="$pw" psql "host=127.0.0.1 dbname=anjal user=anjal" -Atc "select to_regclass('public.$t')" | grep -qx "$t"
          done

      - name: Fill the shipped env templates as DEPLOY.md section 4 does
        run: |
          set -euo pipefail
          token=$(openssl rand -hex 24); kek=$(openssl rand -base64 32)
          echo "::add-mask::$token"; echo "::add-mask::$kek"
          sudo sed -i "s|Password=CHANGE-ME|Password=$PGPW|" /etc/anjal/server.env /etc/anjal/webmail.env
          sudo sed -i "s|^ANJAL_API_TOKEN=.*|ANJAL_API_TOKEN=$token|; s|^ANJAL_KEK=.*|ANJAL_KEK=$kek|" /etc/anjal/server.env
          # A name Let's Encrypt refuses to issue for: the account is still
          # created (that is the step DEF-049 broke), then the order is refused.
          sudo sed -i "s|^ANJAL_ACME_DOMAINS=.*|ANJAL_ACME_DOMAINS=anjal-ci.invalid|" /etc/anjal/server.env /etc/anjal/webmail.env
          sudo sed -i 's|^# ANJAL_ACME_STAGING=true.*|ANJAL_ACME_STAGING=true|' /etc/anjal/webmail.env
          test "$(sudo grep -c CHANGE-ME /etc/anjal/server.env /etc/anjal/webmail.env | awk -F: '{s+=$2} END {print s}')" -eq 0

      - name: Start both services under their systemd units
        run: |
          set -euo pipefail
          sudo systemctl start anjal-server anjal-webmail
          # Long enough for a crash loop (RestartSec=5) to show, and for the
          # ACME client to reach Let's Encrypt staging.
          for i in $(seq 1 12); do
            sleep 5
            if sudo journalctl -u anjal-webmail --no-pager | grep -q "ACME account:"; then break; fi
          done

      - name: Both stay up, with no restarts and no unhandled exception
        run: |
          set -euo pipefail
          sudo journalctl -u anjal-server -u anjal-webmail --no-pager > "$RUNNER_TEMP/services.log"
          cat "$RUNNER_TEMP/services.log"
          for s in anjal-server anjal-webmail; do
            state=$(systemctl is-active "$s" || true)
            restarts=$(systemctl show "$s" -p NRestarts --value)
            echo "$s: $state, restarts=$restarts"
            test "$state" = active
            test "$restarts" -eq 0
          done
          if grep -q "Unhandled exception" "$RUNNER_TEMP/services.log"; then
            echo "::error::a service logged an unhandled exception"; exit 1
          fi
          # rc.5 (decision 2B): greylisting keeps remembered senders in its state
          # file under the shipped unit, and does not delay senders passing SPF.
          # rc.7: the database is the primary record, the file its mirror.
          grep -q "Greylisting: on (delay 300s, senders remembered 35 days, kept in the database and mirrored to /var/lib/anjal/greylist.tsv, senders passing SPF not delayed)." "$RUNNER_TEMP/services.log"
          # rc.7: settings live in the database; each service imports its env once.
          grep -q "Settings: none stored yet for server; imported" "$RUNNER_TEMP/services.log"
          grep -q "Settings: none stored yet for webmail; imported" "$RUNNER_TEMP/services.log"
          # rc.7 (DEF-064 and the owner's rule): never unencrypted, with DHE and RSA-GCM offered.
          if grep -q "Outbound worker started" "$RUNNER_TEMP/services.log"; then
            grep -q "never unencrypted, 13 cipher suites incl. DHE and RSA-GCM" "$RUNNER_TEMP/services.log"
          fi
          # DEF-048: the spam filter swallowed the same failure; it must not recur.
          if grep -q "no system DNS resolver" "$RUNNER_TEMP/services.log"; then
            echo "::error::the DNS resolver could not be created under the unit's sandbox"; exit 1
          fi

      - name: Health, and the network exposure of DEPLOY.md section 1c
        run: |
          set -euo pipefail
          curl -fsS http://127.0.0.1:8025/healthz | tee "$RUNNER_TEMP/health.json"; echo
          jq -e '.components[] | select(.name=="store") | .status=="ok"' "$RUNNER_TEMP/health.json"
          jq -e '.components[] | select(.name=="maildir") | .status=="ok"' "$RUNNER_TEMP/health.json"
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1/ || true)
          echo "webmail http status: $code"
          test "$code" != "000"
          test "${code:0:1}" != "5"
          sudo ss -tlnp | tee "$RUNNER_TEMP/listen.txt"
          grep -qE '127\.0\.0\.1:8025\b' "$RUNNER_TEMP/listen.txt"
          if grep -E '(0\.0\.0\.0|\*|\[::\]):8025\b' "$RUNNER_TEMP/listen.txt"; then
            echo "::error::the admin API is reachable from outside"; exit 1
          fi
          for p in 25 587 465 80 443; do grep -qE "0\.0\.0\.0:$p\b" "$RUNNER_TEMP/listen.txt"; done

      - name: The ACME client speaks to the real Let's Encrypt (staging)
        run: |
          set -euo pipefail
          # DEF-049: the fake ACME server in the unit tests accepted a header
          # that Let's Encrypt refuses. An account is created only if every
          # request so far - nonce, JWS, Content-Type - was acceptable.
          if sudo journalctl -u anjal-webmail --no-pager | grep -q "Invalid Content-Type"; then
            echo "::error::Let's Encrypt refused the Content-Type header"; exit 1
          fi
          sudo journalctl -u anjal-webmail --no-pager | grep "ACME account:"

      - name: A bodyless admin POST is refused and changes nothing
        run: |
          set -euo pipefail
          # DEF-053: curl -X POST without -d sends no Content-Length. The
          # listener answers 411 - and up to rc.2 the request was carried out
          # anyway. The webmail is stopped so that a wrongly written renewal
          # marker cannot be consumed before it is looked for.
          sudo systemctl stop anjal-webmail
          token=$(sudo grep '^ANJAL_API_TOKEN=' /etc/anjal/server.env | cut -d= -f2-)
          echo "::add-mask::$token"
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H "Authorization: Bearer $token" http://127.0.0.1:8025/api/acme/renew)
          echo "without a body: $code"
          test "$code" = 411
          sleep 2
          if sudo test -e /var/lib/anjal/acme/renew.request; then
            echo "::error::a request answered 411 still requested a renewal"; exit 1
          fi
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -d '' -H "Authorization: Bearer $token" http://127.0.0.1:8025/api/acme/renew)
          echo "with -d '': $code"
          test "$code" = 202
          sudo test -e /var/lib/anjal/acme/renew.request

      - name: Settings in the database hold no secrets (rc.7)
        run: |
          set -euo pipefail
          token=$(sudo grep '^ANJAL_API_TOKEN=' /etc/anjal/server.env | cut -d= -f2-)
          curl -sf -H "Authorization: Bearer $token" http://127.0.0.1:8025/api/settings > "$RUNNER_TEMP/settings.json"
          jq -r '.server[].key, .webmail[].key' "$RUNNER_TEMP/settings.json" | tee "$RUNNER_TEMP/settings-keys.txt"
          test "$(jq '.server | length' "$RUNNER_TEMP/settings.json")" -gt 0
          test "$(jq '.webmail | length' "$RUNNER_TEMP/settings.json")" -gt 0
          if grep -E '(POSTGRES|PASSWORD|TOKEN|SECRET|KEK)' "$RUNNER_TEMP/settings-keys.txt"; then
            echo "::error::a secret was stored in the settings table"; exit 1
          fi
          code=$(curl -s -o /dev/null -w '%{http_code}' -X PUT -H "Authorization: Bearer $token" -H 'Content-Type: application/json' -d '{"value":"x"}' http://127.0.0.1:8025/api/settings/server/ANJAL_KEK)
          test "$code" = 400

      - name: Evidence under the real units (rc.8)
        run: |
          set -euo pipefail
          token=$(sudo grep '^ANJAL_API_TOKEN=' /etc/anjal/server.env | cut -d= -f2-)
          echo "::add-mask::$token"
          api() { curl -sS -f -H "Authorization: Bearer $token" -H 'Content-Type: application/json' "$@"; }
          q() { PGPASSWORD="$PGPW" psql "host=127.0.0.1 dbname=anjal user=anjal" -Atc "$1"; }
          slog=$(sudo journalctl -u anjal-server --no-pager)
          grep -q "Evidence: originals kept in /var/lib/anjal/evidence" <<< "$slog"
          test "$(sudo stat -c '%U %a' /var/lib/anjal/evidence)" = "anjal 750"
          # A tenant, its domain and a mailbox - through the admin API, as an operator would.
          api -X POST -d '{"slug":"ci","displayName":"CI","enabled":true,"postmasterMailbox":"ci@anjal.co.in"}' http://127.0.0.1:8025/api/tenants >/dev/null
          api -X POST -d '{"tenantSlug":"ci","domain":"anjal.co.in"}' http://127.0.0.1:8025/api/tenant-domains >/dev/null
          api -X POST -d "{\"tenantSlug\":\"ci\",\"address\":\"ci@anjal.co.in\",\"password\":\"$(openssl rand -hex 16)\",\"displayName\":\"CI\"}" http://127.0.0.1:8025/api/mailboxes >/dev/null
          # A real SMTP delivery, with a bare LF the working copy repairs and the evidence must keep.
          python3 - <<'EOF'
          import smtplib
          msg = (b"From: CI <ci@anjal-ci.invalid>\r\nTo: ci@anjal.co.in\r\nSubject: rc.8 evidence\r\n"
                 b"Message-ID: <rc8-evidence@anjal-ci.invalid>\r\n\r\nA line ending in a bare LF\nand the end.\r\n")
          with smtplib.SMTP("127.0.0.1", 25, timeout=30) as s:
              s.ehlo("ci.anjal-ci.invalid")
              s.sendmail("ci@anjal-ci.invalid", ["ci@anjal.co.in"], msg)
              s.rset()
              s.mail("ci@anjal-ci.invalid")
              code, reply = s.rcpt("Postmaster")
              assert code == 250, (code, reply)
              print("bare <Postmaster> accepted:", code)
          open("/tmp/sent.eml", "wb").write(msg)
          EOF
          sleep 2
          id=$(q "select id from evidence where direction='in' and envelope_from='ci@anjal-ci.invalid' and outcome='accepted' order by captured_at desc limit 1")
          test -n "$id"
          path=$(q "select path from evidence where id='$id'")
          sha=$(q "select sha256 from evidence where id='$id'")
          f="/var/lib/anjal/evidence/$path"
          test "$(sudo stat -c '%U %a' "$f")" = "anjal 440"
          test "$(sudo sha256sum "$f" | cut -c1-64)" = "$sha"
          sudo cmp "$f" /tmp/sent.eml                                   # exactly as sent
          test "$(q "select count(*) from messages where evidence_id='$id'")" -eq 1
          api "http://127.0.0.1:8025/api/evidence/$id/raw" -o /tmp/raw.eml
          cmp /tmp/raw.eml /tmp/sent.eml
          test "$(q "select count(*) from audit_events where action='READ evidence raw' and subject='$id'")" -ge 1
          api -X POST -d '' http://127.0.0.1:8025/api/evidence/verify | python3 -c 'import sys,json; d=json.load(sys.stdin); assert d["intact"], d; print("chain intact")'
          echo "evidence $id: kept exactly as sent, read-only, hash verified, audited"

      - name: Standards conformance under the real units (rc.9, ANJAL-TST-12)
        run: |
          set -euo pipefail
          python3 - <<'EOF'
          import smtplib, re
          with smtplib.SMTP("127.0.0.1", 25, timeout=30) as s:
              code, ehlo = s.ehlo("ci.anjal-ci.invalid")
              kw = ehlo.decode().upper()
              assert "PIPELINING" in kw and "ENHANCEDSTATUSCODES" in kw, kw
              checks = [("EXPN staff", "502"), ("MAIL FROM:<ci@anjal-ci.invalid> FOO=BAR", "555"), ("MAIL FROM:<ci@anjal-ci.invalid> SMTPUTF8", "555"),
                        ("MAIL FROM:<ci@anjal-ci.invalid>", "250"), ("RCPT TO:<ci@anjal.co.in> NOTIFY=NEVER", "555"), ("RCPT TO:<ci@anjal.co.in>", "250"),
                        ("RSET", "250"), ("NOOP", "250"), ("FROBNICATE", "500")]
              for cmd, want in checks:
                  code, text = s.docmd(cmd)
                  line = f"{code} {text.decode()}"
                  assert line.startswith(want), (cmd, line)
                  assert re.match(r"^[245]\d\d [245]\.\d{1,3}\.\d{1,3}\b", line), ("no enhanced status code", cmd, line)
                  print(f"{cmd:45} {line}")
          EOF
          # Final delivery added Return-Path to the stored copy of the evidence step's message (DEF-069);
          # the evidence step already proved that the evidence itself is exactly as sent.
          f=$(sudo grep -rl "rc8-evidence@anjal-ci.invalid" /var/mail/anjal | head -1)
          first=$(sudo head -1 "$f" | tr -d '\r')
          echo "stored copy begins: $first"
          test "$first" = "Return-Path: <ci@anjal-ci.invalid>"

      - name: A backup under its real unit - refused until configured, verified, never leaves the dump
        run: |
          set -euo pipefail
          # The backup had never run under its own unit - the gap that hid
          # DEF-048 for the server. Logs are read whole, then searched: under
          # pipefail "journalctl | grep -q" can fail when grep stops early.
          blog() { sudo journalctl -u anjal-backup --no-pager; }
          # DEF-062: install.sh leaves the timer off until section 11.
          test "$(systemctl is-enabled anjal-backup.timer || true)" = disabled
          sudo apt-get install -y -q rclone
          # Not configured yet: refused before anything is dumped.
          if sudo systemctl start anjal-backup; then echo "::error::an unconfigured backup ran"; exit 1; fi
          log=$(blog); grep -q "backups are not configured" <<< "$log"
          test -z "$(sudo ls -A /var/lib/anjal/backup)"
          # Configured, with an encrypted remote inside the unit's writable path.
          sudo install -d -o anjal -g anjal -m 700 /var/lib/anjal/smoke-remote
          p1=$(rclone obscure "$(openssl rand -base64 24)"); p2=$(rclone obscure "$(openssl rand -base64 24)")
          printf '[loc]\ntype = local\n\n[b2crypt]\ntype = crypt\nremote = loc:/var/lib/anjal/smoke-remote\nfilename_encryption = standard\ndirectory_name_encryption = true\npassword = %s\npassword2 = %s\n' "$p1" "$p2" | sudo tee /etc/anjal/rclone.conf >/dev/null
          sudo chown root:anjal /etc/anjal/rclone.conf
          sudo chmod 640 /etc/anjal/rclone.conf
          sudo -u anjal install -d -m 700 /var/mail/anjal/smoke/ci/cur
          head -c 4000 /dev/urandom | sudo -u anjal tee /var/mail/anjal/smoke/ci/cur/m1 >/dev/null
          sudo systemctl start anjal-backup
          log=$(blog); grep -q "dump uploaded and verified" <<< "$log"; grep -q "verify ok" <<< "$log"
          # rc.8: the evidence reached the encrypted backup, and was verified with it.
          grep -q "verify evidence" <<< "$log"
          # Captured, then searched: "cmd | grep -q" can fail under pipefail when grep stops early.
          ev=$(sudo -u anjal rclone --config /etc/anjal/rclone.conf lsf -R b2crypt:evidence/)
          grep -q '\.eml$' <<< "$ev"
          test -z "$(sudo ls -A /var/lib/anjal/backup)"
          # rc.7: the settings snapshot is backed up with every secret removed.
          snap=$(sudo -u anjal rclone --config /etc/anjal/rclone.conf cat b2crypt:settings/server.env)
          grep -q "^ANJAL_API_TOKEN=<secret removed - see the custody forms>$" <<< "$snap"
          grep -q "^ANJAL_POSTGRES=<secret removed - see the custody forms>$" <<< "$snap"
          token=$(sudo grep '^ANJAL_API_TOKEN=' /etc/anjal/server.env | cut -d= -f2-)
          if grep -qF "$token" <<< "$snap"; then echo "::error::the admin token reached the backup"; exit 1; fi
          # DEF-061: damage the stored mail at rest (size and time unchanged);
          # the next run must fail, and still leave no dump.
          f=$(sudo find /var/lib/anjal/smoke-remote -type f -size 4048c | head -n 1)
          test -n "$f"
          sudo touch -r "$f" /tmp/stamp
          printf '\xff' | sudo dd of="$f" bs=1 seek=2000 conv=notrunc status=none
          sudo touch -r /tmp/stamp "$f"
          # D-88: a failed run is tried again (here after 1 s, not 2-16 minutes), then recorded.
          echo 'ANJAL_BACKUP_RETRY_WAITS="1"' | sudo tee -a /etc/anjal/server.env >/dev/null
          if sudo systemctl start anjal-backup; then echo "::error::a damaged backup verified"; exit 1; fi
          log=$(blog); grep -q "hashes differ" <<< "$log"
          grep -q "try 1 failed" <<< "$log"; grep -q "FAILED after 2 tries" <<< "$log"
          status=$(sudo cat /var/lib/anjal/backup-status)
          grep -q "^ok " <<< "$status"; grep -q "^failed .* after 2 tries" <<< "$status"
          test -z "$(sudo ls -A /var/lib/anjal/backup)"

      - name: HTTP/3 under the real unit (rc.7)
        run: |
          set -euo pipefail
          # libmsquic from Microsoft's repository, exactly as DEPLOY.md section 1d.
          curl -sSLo /tmp/packages-microsoft-prod.deb https://packages.microsoft.com/config/ubuntu/24.04/packages-microsoft-prod.deb
          sudo dpkg -i /tmp/packages-microsoft-prod.deb
          sudo apt-get update -q && sudo apt-get install -y -q libmsquic
          # CI's ACME domain is deliberately invalid, so the webmail has no real
          # certificate. Switch it to a self-signed one: ACME off in the database
          # (settings live there since rc.7) and in the env file, fixed PEM pair on.
          token=$(sudo grep '^ANJAL_API_TOKEN=' /etc/anjal/server.env | cut -d= -f2-)
          curl -s -o /dev/null -X DELETE -H "Authorization: Bearer $token" http://127.0.0.1:8025/api/settings/webmail/ANJAL_ACME_DOMAINS
          sudo sed -i 's|^ANJAL_ACME_DOMAINS=.*|ANJAL_ACME_DOMAINS=|' /etc/anjal/webmail.env
          sudo install -d -o root -g anjal -m 750 /etc/anjal/ci-tls
          # Browsers reach the webmail by NAME over IPv4 (mail.anjal.co.in has an A
          # record only), so the check does too: a test name pointing at 127.0.0.1.
          echo "127.0.0.1 anjal-h3.test mta-sts.anjal-h3.test" | sudo tee -a /etc/hosts >/dev/null
          sudo openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes -days 1 -subj "/CN=anjal-h3.test" \
            -addext "subjectAltName=DNS:anjal-h3.test,DNS:localhost,IP:127.0.0.1" -keyout /etc/anjal/ci-tls/key.pem -out /etc/anjal/ci-tls/cert.pem 2>/dev/null
          sudo chgrp anjal /etc/anjal/ci-tls/key.pem /etc/anjal/ci-tls/cert.pem
          sudo chmod 640 /etc/anjal/ci-tls/key.pem /etc/anjal/ci-tls/cert.pem
          printf 'ANJAL_TLS_CERT_PATH=/etc/anjal/ci-tls/cert.pem\nANJAL_TLS_KEY_PATH=/etc/anjal/ci-tls/key.pem\n' | sudo tee -a /etc/anjal/webmail.env >/dev/null
          # rc.10 (D-63): MTA-STS on, for the test domain, under the real unit.
          printf 'ANJAL_MTA_STS_MODE=testing\nANJAL_MTA_STS_DOMAINS=anjal-h3.test\nANJAL_MTA_STS_MX=mail.anjal-h3.test\n' | sudo tee -a /etc/anjal/webmail.env >/dev/null
          sudo systemctl restart anjal-webmail
          sleep 8
          test "$(systemctl is-active anjal-webmail)" = active
          sudo journalctl -u anjal-webmail --since "-2min" --no-pager > "$RUNNER_TEMP/h3.log"
          grep "HTTP/3:" "$RUNNER_TEMP/h3.log"
          grep -q "HTTP/3: on" "$RUNNER_TEMP/h3.log"
          sudo ss -ulnp | tee "$RUNNER_TEMP/udp.txt"
          grep -E ':443\b' "$RUNNER_TEMP/udp.txt" | grep -q Anjal.Webmail
          # rc.9.2 (DEF-084), under the real unit with HTTP/3 on - as production:
          # TLS 1.2 offers no CBC suite; GCM works; browsers are still told of HTTP/3.
          cbc=$(echo | openssl s_client -connect 127.0.0.1:443 -servername anjal-h3.test -tls1_2 -cipher 'ECDHE-ECDSA-AES256-SHA384:ECDHE-ECDSA-AES128-SHA256' 2>&1 || true)
          if grep -q "Cipher is ECDHE" <<< "$cbc"; then echo "::error::a CBC suite was accepted"; grep "Cipher is" <<< "$cbc"; exit 1; fi
          gcm=$(echo | openssl s_client -connect 127.0.0.1:443 -servername anjal-h3.test -tls1_2 -cipher 'ECDHE-ECDSA-AES128-GCM-SHA256' 2>&1 || true)
          grep "Cipher is" <<< "$gcm"
          grep -q "Cipher is ECDHE-ECDSA-AES128-GCM-SHA256" <<< "$gcm"
          hdr=$(curl -sk -o /dev/null -D - https://anjal-h3.test/sign-in)
          grep -i '^alt-svc' <<< "$hdr"
          grep -qi '^alt-svc: h3=":443"' <<< "$hdr"
          # rc.10 (D-63): the policy, fetched as a sending server fetches it, exactly;
          # another host gets 404; the start-up line says what is served.
          printf 'version: STSv1\r\nmode: testing\r\nmx: mail.anjal-h3.test\r\nmax_age: 86400\r\n' > "$RUNNER_TEMP/sts-expected.txt"
          curl -sk -o "$RUNNER_TEMP/sts.txt" -w '%{http_code} %{content_type}\n' https://mta-sts.anjal-h3.test/.well-known/mta-sts.txt | tee "$RUNNER_TEMP/sts-status.txt"
          grep -q '^200 text/plain' "$RUNNER_TEMP/sts-status.txt"
          cmp "$RUNNER_TEMP/sts.txt" "$RUNNER_TEMP/sts-expected.txt"
          test "$(curl -sk -o /dev/null -w '%{http_code}' https://anjal-h3.test/.well-known/mta-sts.txt)" = 404
          grep "MTA-STS: testing" "$RUNNER_TEMP/h3.log"
          # Which connections work: raw QUIC and HTTP/3, presenting a name or an
          # IP address. Each on a fresh client, every error printed in full.
          cat > "$RUNNER_TEMP/h3.cs" <<'EOF'
          #:property PublishAot=false
          using System.Net;
          using System.Net.Quic;
          using System.Net.Security;
          // .NET 10 builds a single-file program with Native-AOT defaults, which
          // switch HttpClient's HTTP/3 off; PublishAot=false above keeps it on.
          Console.WriteLine($"client: QuicConnection.IsSupported = {QuicConnection.IsSupported}; HttpClient HTTP/3 switch = {(AppContext.TryGetSwitch("System.Net.SocketsHttpHandler.Http3Support", out bool h3on) ? h3on.ToString() : "default (on)")}");
          static void Chain(string label, Exception ex)
          {
              Console.WriteLine($"{label}: FAILED");
              for (Exception? e = ex; e is not null; e = e.InnerException) { Console.WriteLine($"    {e.GetType().FullName}: {e.Message}"); }
          }
          async Task Raw(string label, IPAddress address, string name)
          {
              try
              {
                  using var cts = new CancellationTokenSource(TimeSpan.FromSeconds(10));
                  await using QuicConnection quic = await QuicConnection.ConnectAsync(new QuicClientConnectionOptions
                  {
                      RemoteEndPoint = new IPEndPoint(address, 443),
                      DefaultStreamErrorCode = 0x100,
                      DefaultCloseErrorCode = 0x100,
                      ClientAuthenticationOptions = new SslClientAuthenticationOptions
                      {
                          ApplicationProtocols = new List<SslApplicationProtocol> { new SslApplicationProtocol("h3") },
                          TargetHost = name,
                          RemoteCertificateValidationCallback = (a, b, c, d) => true,
                      },
                  }, cts.Token);
                  Console.WriteLine($"{label}: connected, ALPN {quic.NegotiatedApplicationProtocol}");
              }
              catch (Exception ex) { Chain(label, ex); }
          }
          async Task<bool> Http3(string label, string url)
          {
              try
              {
                  using var client = new HttpClient(new SocketsHttpHandler { SslOptions = { RemoteCertificateValidationCallback = (a, b, c, d) => true } });
                  var r = await client.SendAsync(new HttpRequestMessage(HttpMethod.Get, url) { Version = HttpVersion.Version30, VersionPolicy = HttpVersionPolicy.RequestVersionExact });
                  Console.WriteLine($"{label}: {(int)r.StatusCode}, version {r.Version}");
                  return r.StatusCode == HttpStatusCode.OK && r.Version == HttpVersion.Version30;
              }
              catch (Exception ex) { Chain(label, ex); return false; }
          }
          await Raw("1 raw QUIC, name localhost, 127.0.0.1", IPAddress.Loopback, "localhost");
          await Raw("2 raw QUIC, name 127.0.0.1, 127.0.0.1", IPAddress.Loopback, "127.0.0.1");
          await Raw("3 raw QUIC, name localhost, ::1      ", IPAddress.IPv6Loopback, "localhost");
          await Http3("4 HTTP/3 https://localhost/sign-in (tries IPv6 first)", "https://localhost/sign-in");
          await Http3("5 HTTP/3 https://127.0.0.1/sign-in (IP as TLS name)  ", "https://127.0.0.1/sign-in");
          // The decisive check: a name over IPv4, exactly as browsers reach mail.anjal.co.in.
          bool asBrowsers = await Http3("6 HTTP/3 https://anjal-h3.test/sign-in (name, IPv4)", "https://anjal-h3.test/sign-in");
          Console.WriteLine($"verdict: HTTP/3 as browsers use it (name over IPv4) {(asBrowsers ? "WORKS" : "FAILS")}");
          return asBrowsers ? 0 : 1;
          EOF
          set +e
          dotnet run "$RUNNER_TEMP/h3.cs" 2>&1 | grep -v "warning CA1416"
          rc=${PIPESTATUS[0]}
          set -e
          echo "== webmail log since the restart"
          sudo journalctl -u anjal-webmail --since "-2min" --no-pager | tail -30
          echo "== the in-process HTTP/3 test, outside the unit - must pass too"
          set +e
          dotnet test tests/Anjal.Webmail.Tests -c Release --filter "FullyQualifiedName~Rc7Http3" --logger "console;verbosity=normal" > "$RUNNER_TEMP/h3test.txt" 2>&1
          trc=$?
          set -e
          grep -E "Passed|Failed|Error Message|Exception|QUIC|TLS|HTTP/3:" "$RUNNER_TEMP/h3test.txt" | head -30
          test "$rc" -eq 0
          test "$trc" -eq 0

      - name: A database restore with the real restore.sh (rc.9.2, DEF-083)
        run: |
          set -euo pipefail
          # The restore drill of 1 Oct 2026 found that restore.sh had never
          # restored a database: it read server.env through bash, where the ';'
          # in ANJAL_POSTGRES separates commands, and connected as root. Here the
          # real script restores a real backup into a real PostgreSQL.
          PGPW=$(sudo grep '^ANJAL_POSTGRES=' /etc/anjal/server.env | sed -E 's/.*Password=([^;]*).*/\1/')
          q() { PGPASSWORD="$PGPW" psql "host=127.0.0.1 dbname=anjal user=anjal" -Atc "$1"; }
          fp() { q "select (select count(*) from tenants)||'/'||(select count(*) from mailboxes)||'/'||(select count(*) from evidence)||'/'||(select count(*) from settings)||'/'||(select count(*) from dkim_keys)"; }
          # A clean backup: the backup step damaged a stored file on purpose (DEF-061).
          sudo systemctl stop anjal-server anjal-webmail
          sudo find /var/lib/anjal/smoke-remote -mindepth 1 -delete
          t0=$(date '+%Y-%m-%d %H:%M:%S')
          sudo systemctl start anjal-backup
          log=$(sudo journalctl -u anjal-backup --since "$t0" --no-pager); grep -q "verify ok" <<< "$log"
          before=$(fp); echo "backed up: $before"
          test "$(q "select count(*) from tenants")" -ge 1
          # A change after the backup, which the restore must undo.
          q "insert into settings (scope, key, value, updated_by) values ('server','ANJAL_RESTORE_MARKER','x','ci')" >/dev/null
          # 1. Tenants exist: refused without --force (the files are restored first, the database is not touched).
          if out=$(sudo /opt/anjal/bin/restore.sh 2>&1); then echo "::error::restore over existing tenants ran without --force"; exit 1; fi
          grep -q "already has" <<< "$out"
          test "$(q "select count(*) from settings where key='ANJAL_RESTORE_MARKER'")" = 1
          # 2. With --force: the database is back as it was backed up.
          out=$(sudo /opt/anjal/bin/restore.sh --force 2>&1); echo "$out"
          grep -q "database restored; tenants:" <<< "$out"
          after=$(fp); echo "restored:  $after"
          test "$before" = "$after"
          test "$(q "select count(*) from settings where key='ANJAL_RESTORE_MARKER'")" = 0
          # 3. A wrong database password: refused at once, plainly, nothing changed.
          q "insert into settings (scope, key, value, updated_by) values ('server','ANJAL_RESTORE_MARKER2','x','ci')" >/dev/null
          sudo cp -p /etc/anjal/server.env /tmp/server.env.keep
          sudo sed -i 's/Password=[^;]*/Password=wrong-on-purpose/' /etc/anjal/server.env
          if out=$(sudo /opt/anjal/bin/restore.sh --force 2>&1); then echo "::error::restore ran with a wrong password"; exit 1; fi
          grep -q "Cannot connect to the database as anjal" <<< "$out"
          if grep -q "restore database" <<< "$out"; then echo "::error::the database step started without a connection"; exit 1; fi
          sudo cp -p /tmp/server.env.keep /etc/anjal/server.env
          test "$(q "select count(*) from settings where key='ANJAL_RESTORE_MARKER2'")" = 1
          # 4. Back up and healthy.
          sudo systemctl start anjal-server anjal-webmail
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8025/healthz >/dev/null 2>&1 && break; sleep 1; done
          curl -fsS http://127.0.0.1:8025/healthz | grep -q '"status"'

      - name: Service logs on failure
        if: failure()
        run: sudo journalctl -u anjal-server -u anjal-webmail -u anjal-backup -u postgresql --no-pager | tail -200
