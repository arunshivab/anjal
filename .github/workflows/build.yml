name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal

      # rc.27 (D-311): the suite again on Indian time. An HTTP key's end date failed on the
      # owner's computer (D-295) and passed here, because CI runs in UTC.
      - name: Test on Indian time
        if: runner.os == 'Linux'
        env:
          TZ: Asia/Kolkata
        run: dotnet test --no-build --configuration Release --verbosity normal
