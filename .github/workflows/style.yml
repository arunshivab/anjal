name: style

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Verify formatting
        run: dotnet format --verify-no-changes --verbosity diagnostic

      # DEF-051: tests/Anjal.Dns.Tests sat outside Anjal.slnx from May to
      # September 2026, so neither CI nor a local "dotnet test" ever built or
      # ran it, and it stopped compiling unnoticed. A project that exists on
      # disk but not in the solution now fails this check.
      - name: Every project is in the solution
        run: |
          missing=0
          for p in $(git ls-files '*.csproj'); do
            if ! grep -qF "Path=\"$p\"" Anjal.slnx; then
              echo "::error::$p is not in Anjal.slnx - CI will never build or test it"
              missing=1
            fi
          done
          exit $missing

      # rc.15 (owner, 7 Oct 2026): the word list and the colours are checked on
      # every change, not only in the local PowerShell block. The generated
      # files must match what the owner's sheet and tokens make, every word a
      # screen shows must come from the list, and every colour pairing must
      # meet its contrast minimum.
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Words and colours
        run: |
          set -euo pipefail
          pip install --quiet openpyxl
          python tools/gen_tokens_css.py
          python tools/check_contrast.py
          python tools/gen_words.py
          if [ -n "$(git status --porcelain src/Anjal.Webmail/wwwroot/tokens.css src/Anjal.Webmail/Resources/Words)" ]; then
            echo "::error::tokens.css or the word files do not match tools/design. Run gen_tokens_css.py and gen_words.py locally and commit the result."
            git status --porcelain
            exit 1
          fi
          python tools/check_words.py
