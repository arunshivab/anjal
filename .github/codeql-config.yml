name: Anjal CodeQL configuration

# Deliberately minimal. Two things are worth knowing about C# here:
#
#  * paths-ignore does NOT exclude code in a compiled language. CodeQL
#    analyses whatever the build compiles, so test code is excluded by the
#    workflow building only src/ and examples/, never tests/.
#
#  * The query suite is chosen in the workflow: security-extended, which adds
#    the lower-severity security queries including inefficient regular
#    expressions. DEF-044 was one of those, so they earn their run time.
